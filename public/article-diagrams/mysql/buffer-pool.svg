<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Buffer pool 的读页与脏页刷新</title>
  <desc id="desc">请求优先访问缓冲池，命中则直接使用页，未命中则从表空间载入。修改使页成为脏页；后台刷新前先满足 WAL，再经双写保护写回数据文件。此流程不表示每次查询一定发生磁盘读。</desc>
  <style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#263d55;font-size:20px}.heading{font-size:32px;font-weight:700}.label{font-size:24px;font-weight:700}.note{font-size:18px}.node{fill:#f7efdf}.arrow{fill:none;stroke:#263d55;stroke-width:3;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#263d55"/></marker></defs>
  <rect width="1200" height="600" rx="24" fill="#ecf3eb"/>
  <text x="48" y="60" class="heading">Buffer pool：缓存的是页，不是 SQL 结果</text>
  <text x="48" y="96" class="note">原理示意 · 命中、装入与刷新是不同路径</text>
  <rect x="48" y="168" width="264" height="144" rx="12" class="node"/>
  <text x="72" y="212" class="label">读写请求</text><text x="72" y="256">访问数据 / 索引页</text>
  <path d="M312 240H432" class="arrow"/>
  <rect x="432" y="144" width="360" height="216" rx="12" fill="#d1e5e4"/>
  <text x="456" y="188" class="label">Buffer pool</text><text x="456" y="232">命中：使用已有页</text>
  <text x="456" y="276">修改：页变为脏页</text><text x="456" y="320">未修改页可按策略淘汰</text>
  <rect x="936" y="168" width="216" height="144" rx="12" class="node"/>
  <text x="960" y="212" class="label">表空间</text><text x="960" y="256">磁盘上的页</text>
  <path d="M936 204H792" class="arrow"/><text x="816" y="180" class="note">未命中装入</text>
  <path d="M612 360V432H1044V312" class="arrow"/>
  <text x="48" y="424" class="label">后台刷新</text><text x="48" y="468">脏页 → 满足 WAL → 双写保护 → 数据文件</text>
  <text x="48" y="532">提交可先持久化日志，数据页随后刷新；缓冲池与日志缓冲区的内容和职责不同。</text>
  <text x="48" y="568" class="note">未给出命中率、页数、耗时或性能倍数；它们取决于配置与工作负载。</text>
</svg>
