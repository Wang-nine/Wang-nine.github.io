<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">缓存穿透、击穿与雪崩的触发范围</title>
  <desc id="desc">穿透针对缓存和数据库都不存在的数据；击穿针对单个热点键失效后并发重建；雪崩针对大量键同时失效或 Redis 不可用。三条不同路径最终都可能增加数据库负载。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#263d55;font-size:22px}.title{font-size:32px;font-weight:700}.head{font-size:24px;font-weight:700}.note{font-size:20px}.box{fill:#d1e5e4;stroke:#263d55;stroke-width:2}.line{fill:none;stroke:#366775;stroke-width:3;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 10 5 0 10" fill="#366775"/></marker></defs>
  <rect width="960" height="600" fill="#ecf3eb"/><text x="40" y="54" class="title">先看“哪些数据失效”，再选择保护策略</text>
  <text x="40" y="130" class="head">穿透</text><rect x="160" y="94" width="350" height="96" rx="8" class="box"/><text x="184" y="134">反复请求不存在的数据</text><text x="184" y="167" class="note">缓存与数据库均查不到</text><path d="M510 142H630" class="line"/><rect x="640" y="94" width="280" height="96" rx="8" class="box"/><text x="664" y="134">数据库反复查空</text><text x="664" y="167" class="note">空值缓存 / 布隆过滤</text>
  <text x="40" y="286" class="head">击穿</text><rect x="160" y="250" width="350" height="96" rx="8" class="box"/><text x="184" y="290">单个热点 key 突然失效</text><text x="184" y="323" class="note">大量请求同时发现未命中</text><path d="M510 298H630" class="line"/><rect x="640" y="250" width="280" height="96" rx="8" class="box"/><text x="664" y="290">并发重建冲击数据库</text><text x="664" y="323" class="note">互斥重建 / 逻辑过期</text>
  <text x="40" y="442" class="head">雪崩</text><rect x="160" y="406" width="350" height="96" rx="8" class="box"/><text x="184" y="446">大量 key 失效或 Redis 故障</text><text x="184" y="479" class="note">影响多个数据与业务请求</text><path d="M510 454H630" class="line"/><rect x="640" y="406" width="280" height="96" rx="8" class="box"/><text x="664" y="446">大量请求转向数据库</text><text x="664" y="479" class="note">错开 TTL / 限流与降级</text>
  <text x="40" y="557" class="note">热点击穿不是数据不存在；错开 TTL 也不能单独解决整个 Redis 服务不可用。</text>
</svg>
