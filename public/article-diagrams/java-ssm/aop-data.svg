<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
<title id="title">AOP 通知获取参数、返回值和异常</title>
<desc id="desc">代理收到方法调用后执行目标方法，正常返回与抛出异常分为两条路径。JoinPoint 获取参数，返回后通知获取结果，异常后通知获取异常，环绕通知用 proceed 连接调用。</desc>
<style>:root{--paper:#f7efdf;--panel:#ecf3eb;--wash:#d1e5e4;--ink:#263d55;--line:#366775}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:var(--ink);font-size:18px}.title{font-size:20px;font-weight:700}.small{font-size:16px}.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.wash{fill:var(--wash)}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#366775"/></marker></defs><path fill="#f7efdf" d="M0 0H960V580H0z"/>
<text x="36" y="44" class="title">AOP 的数据入口与出口 · 原理示意</text>
<text x="36" y="76" class="small">下图表达数据可获取的位置，不规定多个切面或多种通知的统一执行顺序。</text>
<rect x="36" y="116" width="242" height="100" rx="8" class="box"/><text x="56" y="150" class="title">调用者 → 代理</text><text x="56" y="184">传入目标方法的参数</text>
<path d="M278 166H382" class="flow"/><text x="290" y="144" class="small">方法执行</text>
<rect x="386" y="116" width="230" height="100" rx="8" class="box wash"/><text x="406" y="150" class="title">目标方法</text><text x="406" y="184">参数可由 getArgs() 读取</text>
<path d="M616 166H678V286H714" class="flow"/><text x="693" y="235" class="small">正常返回</text>
<path d="M502 216V394H714" class="flow"/><text x="516" y="370" class="small">抛出异常</text>
<rect x="718" y="254" width="206" height="80" rx="8" class="box"/><text x="738" y="285">@AfterReturning</text><text x="738" y="313">绑定返回值</text>
<rect x="718" y="366" width="206" height="80" rx="8" class="box"/><text x="738" y="397">@AfterThrowing</text><text x="738" y="425">绑定异常对象</text>
<rect x="36" y="268" width="398" height="178" rx="8" class="box wash"/><text x="56" y="303" class="title">@Around：控制调用边界</text><text x="56" y="338">ProceedingJoinPoint 也可获取参数</text><text x="56" y="372">proceed() 执行后续链与目标方法</text><text x="56" y="406">接收结果并返回；按需捕获并重抛异常</text>
<text x="36" y="497">@After 表达最终清理位置：不因正常返回或抛出异常而二选一。</text>
<text x="36" y="533" class="small">未调用 proceed() 可以跳过目标方法；返回后通知与异常后通知则观察各自的结果分支。</text>
</svg>
