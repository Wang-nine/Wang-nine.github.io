<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title desc">
<title id="title">SSM 图书管理系统的请求与配置链路</title>
<desc id="desc">客户端请求经 DispatcherServlet 到 BookController，再调用 BookService 和 MyBatis 的 BookDao 代理，通过数据源访问 tbl_book；结果沿调用链返回并序列化为 JSON。配置分为根容器和 Spring MVC 子容器。</desc>
<style>:root{--paper:#f7efdf;--panel:#ecf3eb;--wash:#d1e5e4;--ink:#263d55;--line:#366775}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:var(--ink);font-size:18px}.title{font-size:20px;font-weight:700}.small{font-size:16px}.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.wash{fill:var(--wash)}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#366775"/></marker></defs><path fill="#f7efdf" d="M0 0H960V680H0z"/>
<text x="36" y="44" class="title">SSM 图书管理系统 · 原理示意</text><text x="36" y="76" class="small">以 GET /books 为例；图中类名与职责来自本文的配置、Controller、Service 和 Dao 代码。</text>
<rect x="36" y="116" width="190" height="94" rx="8" class="box"/><text x="56" y="150" class="title">客户端</text><text x="56" y="185">请求 /books</text>
<path d="M226 163H308" class="flow"/>
<rect x="312" y="116" width="278" height="94" rx="8" class="box wash"/><text x="332" y="150">DispatcherServlet</text><text x="332" y="185">按 HTTP 方法与路径分派</text>
<path d="M590 163H672" class="flow"/>
<rect x="676" y="116" width="248" height="94" rx="8" class="box"/><text x="696" y="150">BookController</text><text x="696" y="185">getAll() 接收请求</text>
<path d="M800 210V286" class="flow"/><text x="815" y="254" class="small">调用业务层</text>
<rect x="636" y="290" width="288" height="112" rx="8" class="box wash"/><text x="656" y="325">BookService / 实现类</text><text x="656" y="360">组织业务与事务边界</text><text x="656" y="389" class="small">注入 BookDao 代理</text>
<path d="M636 346H540" class="flow"/>
<rect x="284" y="290" width="252" height="112" rx="8" class="box"/><text x="304" y="325">MyBatis BookDao 代理</text><text x="304" y="360">执行注解中的 SQL</text><text x="304" y="389" class="small">结果映射到 Book</text>
<path d="M284 346H230" class="flow"/>
<rect x="36" y="290" width="190" height="112" rx="8" class="box"/><text x="56" y="325">数据源 / JDBC</text><text x="56" y="360">MySQL</text><text x="56" y="389">tbl_book</text>
<text x="36" y="451">响应：Book / List&lt;Book&gt; 沿调用链返回 → MVC 消息转换 → JSON 响应</text>
<rect x="36" y="486" width="888" height="150" rx="8" class="box wash"/><text x="56" y="521" class="title">ServletConfig 分别加载两个配置入口</text><text x="56" y="555">根容器 SpringConfig：Service 扫描、JdbcConfig、MybatisConfig、事务支持</text><text x="56" y="589">MVC 子容器 SpringMvcConfig：Controller 扫描、@EnableWebMvc</text><text x="56" y="619" class="small">子容器可使用父容器中的业务 Bean；MybatisConfig 扫描 com.wang.dao 创建 Mapper 代理。</text>
</svg>
