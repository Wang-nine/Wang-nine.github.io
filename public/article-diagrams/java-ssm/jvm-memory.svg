<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">JVM 运行时数据区与直接内存</title>
<desc id="desc">两个线程各自拥有程序计数器、虚拟机栈和本地方法栈；线程共享堆和方法区。栈中引用可指向堆对象，堆中的 DirectByteBuffer 可关联运行时数据区之外的直接内存。</desc>
<style>:root{--paper:#f7efdf;--panel:#ecf3eb;--wash:#d1e5e4;--ink:#263d55;--line:#366775}text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:var(--ink);font-size:18px}.title{font-size:20px;font-weight:700}.small{font-size:16px}.box{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.wash{fill:var(--wash)}.flow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#366775"/></marker></defs><path fill="#f7efdf" d="M0 0H960V660H0z"/>
<text x="36" y="44" class="title">JVM 内存划分 · 原理示意</text><text x="36" y="76" class="small">按线程归属区分逻辑区域；不是物理地址布局，也不是 Java Memory Model 的示意。</text>
<rect x="36" y="106" width="424" height="216" rx="8" class="box"/><text x="56" y="140" class="title">线程 A · 私有</text>
<text x="56" y="178">程序计数器：当前指令位置</text><text x="56" y="214">Java 虚拟机栈：方法调用的栈帧</text><text x="56" y="248">栈帧含局部变量、操作数栈等</text><text x="56" y="284">本地方法栈：服务于 Native 方法</text>
<rect x="500" y="106" width="424" height="216" rx="8" class="box"/><text x="520" y="140" class="title">线程 B · 私有</text>
<text x="520" y="178">程序计数器</text><text x="520" y="214">Java 虚拟机栈</text><text x="520" y="248">每次调用对应独立栈帧</text><text x="520" y="284">本地方法栈</text>
<path d="M248 322V386" class="flow"/><path d="M712 322V356H420V386" class="flow"/><text x="42" y="365" class="small">栈中对象引用</text>
<rect x="36" y="390" width="424" height="122" rx="8" class="box wash"/><text x="56" y="423" class="title">堆 Heap · 线程共享</text><text x="56" y="458">对象实例、数组；垃圾回收主要区域</text><text x="56" y="491">DirectByteBuffer 对象也在堆中</text>
<rect x="500" y="390" width="424" height="122" rx="8" class="box wash"/><text x="520" y="423" class="title">方法区 · 线程共享</text><text x="520" y="458">类信息、运行时常量池等</text><text x="520" y="491">HotSpot JDK 8 起以元空间存类元数据</text>
<path d="M248 512V554" class="flow"/>
<rect x="36" y="558" width="888" height="64" rx="8" class="box"/><text x="56" y="585" class="title">直接内存 · 运行时数据区之外</text><text x="490" y="600" class="small">NIO 可通过 Native 分配，由缓冲区对象关联</text>
</svg>
