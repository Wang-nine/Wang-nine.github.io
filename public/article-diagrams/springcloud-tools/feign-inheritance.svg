<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Feign 公共父接口复用方案</title><desc id="desc">公共接口描述方法签名，消费者 Feign 接口继承它，提供者 Controller 实现它。继承和实现是代码关系，运行时仍通过 HTTP 远程调用，映射注解的继承行为需结合版本验证。</desc>
  <!-- Contract: existing palette; 8px grid; type 32/24/20. -->
  <style>text{font-family:system-ui,sans-serif;fill:#263d55;font-size:20px}.title{font-size:32px;font-weight:700}.node{font-size:24px;font-weight:600}.edge{fill:none;stroke:#366775;stroke-width:3;marker-end:url(#a)}.relation{stroke-dasharray:8 6}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#366775"/></marker></defs>
  <rect width="960" height="560" fill="#ecf3eb"/><text x="40" y="56" class="title">方案一：公共父接口</text><text x="40" y="88">原理示意 · 代码契约复用，不等于本地方法调用</text>
  <rect x="280" y="128" width="400" height="96" rx="16" fill="#f7efdf"/><text x="312" y="168" class="node">公共 API 接口</text><text x="312" y="200">方法签名、参数与返回类型</text>
  <rect x="40" y="312" width="368" height="112" rx="16" fill="#d1e5e4"/><text x="64" y="352" class="node">消费者：Feign 接口</text><text x="64" y="392">声明服务名与远程调用入口</text>
  <rect x="552" y="312" width="368" height="112" rx="16" fill="#d1e5e4"/><text x="576" y="352" class="node">提供者：Controller</text><text x="576" y="392">接收 HTTP 请求并实现业务接口</text>
  <path d="M224 312V264H376V224M736 312V264H584V224" class="edge relation"/><text x="112" y="264">继承</text><text x="784" y="264">实现</text>
  <path d="M408 368H552" class="edge"/><text x="432" y="344">HTTP</text>
  <text x="40" y="480">共享接口会耦合两端的契约变更；避免把服务端实现细节暴露给消费者。</text>
  <text x="40" y="520">映射注解能否继承应按版本核对，不能只凭 Java 方法继承推断 HTTP 映射。</text>
</svg>
