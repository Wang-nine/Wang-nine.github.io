<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Eureka 注册、发现与直接调用</title><desc id="desc">用户服务实例向 Eureka 注册和发送心跳。订单服务获取实例列表，在客户端选择实例，再直接调用用户服务；业务流量不经过注册中心。</desc>
  <!-- Contract: existing illustration palette; 8px spacing; type 32/24/20; no external resources. -->
  <style>:root{--paper:#ecf3eb;--panel:#d1e5e4;--warm:#f7efdf;--ink:#263d55;--line:#366775}text{font-family:system-ui,sans-serif;fill:var(--ink);font-size:20px}.title{font-size:32px;font-weight:700}.node{font-size:24px;font-weight:600}.edge{fill:none;stroke:var(--line);stroke-width:3;marker-end:url(#a)}.control{stroke-dasharray:8 6}</style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#366775"/></marker></defs>
  <rect width="960" height="560" fill="#ecf3eb"/><text x="40" y="56" class="title">先发现地址，再直接调用</text><text x="40" y="88">原理示意 · 虚线为治理信息，实线为业务调用</text>
  <rect x="344" y="128" width="272" height="104" rx="16" fill="#f7efdf"/><text x="376" y="168" class="node">Eureka Server</text><text x="376" y="204">服务名 → 实例地址列表</text>
  <rect x="40" y="320" width="320" height="136" rx="16" fill="#d1e5e4"/><text x="64" y="360" class="node">order-service</text><text x="64" y="396">② 拉取 userservice 列表</text><text x="64" y="428">③ 客户端负载均衡选实例</text>
  <rect x="664" y="304" width="256" height="64" rx="16" fill="#d1e5e4"/><text x="688" y="344" class="node">user-service 实例 A</text>
  <rect x="664" y="400" width="256" height="64" rx="16" fill="#d1e5e4"/><text x="688" y="440" class="node">user-service 实例 B</text>
  <path d="M792 304V180H616" class="edge control"/><text x="648" y="152">① 注册与心跳</text>
  <path d="M200 320V180H344" class="edge control"/>
  <path d="M360 384H576V336H664" class="edge"/><text x="384" y="424">④ HTTP 请求</text>
  <text x="40" y="520">注册中心提供地址信息，不是业务请求的中转站；消费者也可以注册自身服务。</text>
</svg>
